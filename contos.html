<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contos — ZAMBRIA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="site-shell" id="site-shell">

    <aside class="sidebar" id="sidebar-zambria">
      <div class="sidebar-header">
        <button class="btn-toggle-sidebar" id="btnToggleSidebar" aria-label="Esconder barra lateral">☰</button>
        <div class="site-title">ZAMBRIA</div>
      </div>
      <div class="site-subtitle">O Insólito Presente</div>

      <div class="categoria-grupo">
        <div class="categoria-titulo">Contos</div>
        <ul class="lista-topicos">
          <li><a href="contos-01.html">O Olhar de Pedra</a></li>
          <li><a href="contos-02.html">O Tom das 3h14</a></li>
          <li><a href="contos-03.html">A Última Noite de Marte</a></li>
          <li><a href="contos-04.html">O Diário do Vigia</a></li>
          <li><a href="index.html">← Voltar ao início</a></li>
        </ul>
      </div>
    </aside>

    <main class="conteudo">
      <section class="hero">
        <h1>Contos</h1>
        <p>Escolha um conto na lista à esquerda para ler o conteúdo.</p>
      </section>
    </main>

  </div>

  <script>
    const btn = document.getElementById('btnToggleSidebar');
    const shell = document.querySelector('.site-shell');
    btn.addEventListener('click', () => {
      shell.classList.toggle('sidebar-hidden');
      if (shell.classList.contains('sidebar-hidden')) {
        btn.textContent = '≡';
        btn.setAttribute('aria-label', 'Mostrar barra lateral');
      } else {
        btn.textContent = '☰';
        btn.setAttribute('aria-label', 'Esconder barra lateral');
      }
    });
  </script>

</body>
</html>
