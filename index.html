<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAMBRIA — UFO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            'slideFadeIn': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            'slideFadeOut': {
              '0%': { opacity: '1', transform: 'translateY(0)' },
              '100%': { opacity: '0', transform: 'translateY(-10px)' }
            }
          },
          animation: {
            'slide-fade-in': 'slideFadeIn 0.3s ease forwards',
            'slide-fade-out': 'slideFadeOut 0.2s ease forwards'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideFadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }
    .li-initial { opacity: 0; }
  </style>
  <style>
    .site-shell.sidebar-hidden .sidebar {
      transform: translateX(-100%);
    }
    .site-shell.sidebar-hidden .conteudo {
      padding-left: 2rem;
    }
  </style>
</head>
<body class="bg-black text-white font-sans leading-relaxed min-h-screen">

  <div class="site-shell flex min-h-screen transition-all duration-300" id="site-shell">

    <!-- Botão SEMPRE visível, fora da sidebar -->
    <button class="btn-toggle-sidebar w-8 h-8 bg-red-600 text-black rounded font-black text-lg cursor-pointer transition-all duration-200 leading-none text-center p-0 shrink-0 fixed top-4 left-4 z-50" id="btnToggleSidebar" aria-label="Esconder barra lateral">☰</button>

    <aside class="sidebar w-80 bg-black border-r border-gray-700 p-6 overflow-y-auto shrink-0 sticky top-0 h-screen transition-all duration-300" id="sidebar-zambria">
      <div class="sidebar-header flex flex-col items-center gap-2 mb-8 text-center">
        <div class="site-title text-2xl font-black uppercase tracking-widest text-white">ZAMBRIA</div>
      </div>
      <div class="site-subtitle text-xs text-red-600 uppercase tracking-widest mb-10 opacity-90 text-center">O Insólito Presente</div>

      <div class="categoria-grupo">
        <div class="categoria-titulo text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3 pl-1 border-l-3 border-red-600" id="categoria-ufo" role="button" tabindex="0" aria-expanded="false">UFO</div>
        <ul class="lista-topicos" id="lista-ufo" style="display: none;">
        </ul>
      </div>
    </aside>

    <main class="conteudo flex-1 p-12 max-w-5xl mx-auto w-full transition-all duration-300">
      <section class="hero text-center mb-12 pb-8 border-b border-gray-700">
        <h1 class="text-5xl font-black leading-tight text-white mb-2">UFO</h1>
        <p class="text-gray-400">Aguardando tópicos da equipe.</p>
      </section>

      <article class="post">
        <div class="post-meta flex gap-4 text-xs text-gray-400 mb-4">
          <span class="categoria uppercase tracking-wider">UFO</span>
          <span>Nenhum tópico selecionado</span>
        </div>
        <h2 class="text-2xl font-bold mb-4">UFO</h2>
        <div class="texto text-gray-300">
          <p>Esta seção está vazia. Os agentes vão alimentar os tópicos em breve.</p>
        </div>
      </article>
    </main>

  </div>

  <script>
    const btn = document.getElementById('btnToggleSidebar');
    const shell = document.querySelector('.site-shell');
    btn.addEventListener('click', () => {
      shell.classList.toggle('sidebar-hidden');
      if (shell.classList.contains('sidebar-hidden')) {
        btn.textContent = '≡';
        btn.setAttribute('aria-label', 'Mostrar barra lateral');
      } else {
        btn.textContent = '☰';
        btn.setAttribute('aria-label', 'Esconder barra lateral');
      }
    });

    const categoria = document.getElementById('categoria-ufo');
    const lista = document.getElementById('lista-ufo');
    const itens = lista.querySelectorAll('li');

    function abrirComCascata() {
      lista.style.display = 'block';
      itens.forEach((li, i) => {
        li.style.animation = 'none';
        li.offsetHeight;
        li.style.animation = `slideFadeIn 0.3s ease forwards`;
        li.style.animationDelay = `${i * 70}ms`;
      });
      categoria.setAttribute('aria-expanded', 'true');
    }

    function fecharComCascata() {
      itens.forEach((li, i) => {
        const reverso = (itens.length - 1 - i) * 50;
        li.style.animation = `slideFadeOut 0.2s ease forwards`;
        li.style.animationDelay = `${reverso}ms`;
      });
      setTimeout(() => {
        lista.style.display = 'none';
        itens.forEach(li => {
          li.style.animation = 'none';
        });
      }, 250);
      categoria.setAttribute('aria-expanded', 'false');
    }

    categoria.addEventListener('click', () => {
      const aberto = lista.style.display === 'block';
      if (aberto) {
        fecharComCascata();
      } else {
        abrirComCascata();
      }
    });
    categoria.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        categoria.click();
      }
    });
  </script>

</body>
</html>
